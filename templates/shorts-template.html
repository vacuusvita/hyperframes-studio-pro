<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shorts Template</title>
<style>body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff;font-family:Inter} #root{position:relative;width:1080px;height:1920px;background:#000;overflow:hidden} .clip{position:absolute;inset:0} .num{font:900 200px/1 Inter} .sub{font:600 40px/1.2 Inter;color:#9FB3C8} .grain{position:absolute;inset:0;opacity:0.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")}</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head><body>
<div id="root" data-composition-id="shorts-v1" data-width="1080" data-height="1920" data-duration="24">
  <div class="clip" data-start="0" data-duration="3" data-track-index="1" id="hook" style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px;text-align:center">
    <div class="num" id="num">720</div><div class="sub" id="sub">screenshots make one video</div>
  </div>
  <div class="clip" data-start="3" data-duration="3" data-track-index="1" id="beat2" style="display:flex;flex-direction:column;justify-content:center;padding:80px"><div style="font:700 48px/1.1 Inter" id="t2">Every frame is a function of t</div></div>
  <div class="clip" data-start="6" data-duration="3" data-track-index="1" id="beat3" style="display:flex;justify-content:center;align-items:center"><div style="font:700 32px Inter;background:#fff;color:#000;padding:20px 32px;border-radius:12px" id="card">Same t. Same pixels.</div></div>
  <div class="clip grain" data-start="0" data-duration="24" data-track-index="10"></div>
</div>
<script>
window.__timelines={};
const tl=gsap.timeline({paused:true});
tl.from("#num",{scale:0.8,opacity:0,duration:0.5,ease:"back.out(1.7)"},0.2);
tl.from("#sub",{y:20,opacity:0,duration:0.4,ease:"power3.out"},0.4);
tl.to("#hook",{opacity:0,y:-20,duration:0.3},2.7);
tl.from("#t2",{y:20,opacity:0,duration:0.5,ease:"power3.out"},3.1);
tl.to("#beat2",{opacity:0,scale:1.03,filter:"blur(8px)",duration:0.35},5.7);
tl.fromTo("#beat3",{scale:0.97,filter:"blur(8px)",opacity:0},{scale:1,filter:"blur(0px)",opacity:1,duration:0.35},5.9);
tl.from("#card",{scale:0.9,opacity:0,duration:0.4,ease:"back.out(1.4)"},6.1);
window.__timelines["shorts-v1"]=tl;
</script></body></html>
